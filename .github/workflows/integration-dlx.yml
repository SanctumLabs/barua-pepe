name: Integration tests (DLX)

on:
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch: {}

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('Pipfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
          pipenv requirements --dev > requirements.txt
          pip install --no-deps -r requirements.txt
          pip install pytest-xdist

      - name: Start RabbitMQ and Redis
        run: docker compose up -d broker cache smtp
        env:
          RABBITMQ_DEFAULT_USER: barua-dlx-test
          RABBITMQ_DEFAULT_PASS: barua-dlx-test-password

      - name: Wait for RabbitMQ
        run: |
          for _ in $(seq 1 60); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 2 http://localhost:15672/api/overview || true)
            if [ "$status" = "200" ] || [ "$status" = "401" ]; then
              echo "RabbitMQ is ready"
              exit 0
            fi
            sleep 1
          done
          docker compose logs broker
          exit 1

      - name: Configure RabbitMQ test account
        run: |
          docker compose exec -T broker rabbitmqctl add_user "$BROKER_USER" "$BROKER_PASSWORD" ||
            docker compose exec -T broker rabbitmqctl change_password "$BROKER_USER" "$BROKER_PASSWORD"
          docker compose exec -T broker rabbitmqctl set_permissions -p / "$BROKER_USER" ".*" ".*" ".*"
        env:
          BROKER_USER: barua-dlx-test
          BROKER_PASSWORD: barua-dlx-test-password

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Start local Celery worker
        run: |
          # start celery worker in background to process tasks during integration tests
          nohup celery -A app.worker.celery_app worker -l info -n ci-worker@%n --concurrency=1 > reports/celery.log 2>&1 &
          sleep 3
        env:
          BROKER_HOST: localhost
          BROKER_PORT: 5672
          BROKER_USER: barua-dlx-test
          BROKER_PASSWORD: barua-dlx-test-password
          RESULT_BACKEND_HOST: localhost

      - name: Run integration tests (parallel)
        env:
          BROKER_HOST: localhost
          BROKER_PORT: 5672
          BROKER_USER: barua-dlx-test
          BROKER_PASSWORD: barua-dlx-test-password
          RABBITMQ_DEFAULT_USER: barua-dlx-test
          RABBITMQ_DEFAULT_PASS: barua-dlx-test-password
        run: |
          # run all integration tests in parallel using pytest-xdist and capture logs
          pytest -q tests/integration -n auto --junitxml=reports/junit.xml > reports/output.log 2>&1

      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: reports/
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose stop broker cache smtp

      - name: Upload RabbitMQ logs (optional)
        if: always()
        run: |
          docker logs barua-pepe-queue > reports/rabbitmq-container.log 2>&1 || true
      - name: Upload RabbitMQ container logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rabbitmq-logs
          path: reports/rabbitmq-container.log

    strategy:
      fail-fast: false
